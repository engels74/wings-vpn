# prek.toml — pre-commit hooks configuration
# Docs: https://prek.j178.dev/configuration/

# Builtin hooks — fast, offline, Rust-native
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "check-merge-conflict" },
  { id = "check-case-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=512"] },
  { id = "detect-private-key" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
]

# Conventional Commits — enforce Conventional Commit message format.
[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "v4.4.0"
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

# Secret / credential leak guard.
[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks" },
]

# Local hooks — Go quality gates.
# NOTE: this fork's binary targets Linux; server/filesystem only compiles with GOOS=linux,
# so build is pinned to GOOS=linux CGO_ENABLED=0 (matches CI) to work on macOS.
# go vet is intentionally omitted: it is not gated by upstream CI and fails on pre-existing
# issues in the legacy tree, which would block every commit.
[[repos]]
repo = "local"
hooks = [
  { id = "gofumpt", name = "gofumpt", entry = "gofumpt -w", language = "system", types = ["go"] },
  { id = "go-build", name = "go build", entry = "env GOOS=linux CGO_ENABLED=0 go build ./...", language = "system", types = ["go"], pass_filenames = false },
]
